services:
  # Elevate Full-Stack Unified Web Service (Backend API + SPA Frontend)
  - type: web
    name: elevate-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # MongoDB Atlas Connection URI (e.g. mongodb+srv://<user>:<password>@cluster.mongodb.net/elevate)
      - key: MONGODB_URI
        sync: false
      # Optional: Google OAuth credentials for "Continue with Google"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Optional: Cloudinary for external persistent image hosting
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
